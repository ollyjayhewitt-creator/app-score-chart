name: Build DarkTask

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only used to attach DarkTask.exe to a v* tag's release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build DarkTask.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DarkTask
          --icon assets/darktask.ico
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          darktask.py

      - uses: actions/upload-artifact@v4
        with:
          name: DarkTask-windows
          path: dist/DarkTask.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DarkTask.exe
